databaseChangeLog:
  - changeSet:
      id: lab-030-contract-drop-billing-columns
      author: aurora.ledger
      labels: contract
      context: prod
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 0
            sql: |
              SELECT COUNT(*) FROM accounts a
              LEFT JOIN account_billing_profiles p ON p.account_id = a.id
              WHERE p.account_id IS NULL
              AND (
                a.billing_address IS NOT NULL
                OR a.billing_city IS NOT NULL
                OR a.billing_country IS NOT NULL
              )
      changes:
        - dropColumn:
            tableName: accounts
            columnName: billing_address
        - dropColumn:
            tableName: accounts
            columnName: billing_city
        - dropColumn:
            tableName: accounts
            columnName: billing_country
      rollback:
        - addColumn:
            tableName: accounts
            columns:
              - column: { name: billing_address, type: TEXT }
              - column: { name: billing_city, type: TEXT }
              - column: { name: billing_country, type: CHAR(2) }
        - sql:
            sql: |
              UPDATE accounts a SET
                billing_address = p.address,
                billing_city = p.city,
                billing_country = p.country
              FROM account_billing_profiles p
              WHERE p.account_id = a.id;
