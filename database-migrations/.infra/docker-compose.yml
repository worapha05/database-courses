services:
  postgres:
    image: postgres:16
    container_name: migrations-bootcamp-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: migrations_lab
    ports:
      - "5432:5432"
    volumes:
      - mig_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mig_pg_data:
